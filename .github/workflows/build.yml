name: build

# Builds the eGNnet binaries on every push to dev and main.
#
#   dev  branch -> builds tagged with env "dev"  (development update channel)
#   main branch -> builds tagged with env "prod" (production update channel)
#
# Targets (pure Go, no CGO, so all cross-compile from the same ubuntu runner):
#   - windows/amd64 -> eGNnet.exe
#   - linux/amd64   -> egnnet   (Ubuntu / other Linux)
#
# The chosen environment is baked into each binary via -ldflags (see buildinfo.go),
# so a running copy reports its own channel at GET /api/version. This is the
# foundation for the future automated per-channel update mechanism.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: eGNnet.exe
          - goos: linux
            goarch: amd64
            output: egnnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine build environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          APP_ENV: ${{ steps.env.outputs.app_env }}
          COMMIT: ${{ steps.env.outputs.commit }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="0.1.0-${APP_ENV}+${COMMIT}"
          echo "Building ${{ matrix.output }}  os=${GOOS}/${GOARCH}  env=${APP_ENV}  version=${VERSION}"
          go build -trimpath \
            -ldflags "-s -w -X main.appEnv=${APP_ENV} -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o dist/${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eGNnet-${{ matrix.goos }}-${{ steps.env.outputs.app_env }}-${{ steps.env.outputs.commit }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
